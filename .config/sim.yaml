# All actions that can be simulated in the repo.

actions:
  get_main_hash:
    desc: "Print the commit hash of remote main"
    input: {}
    output:
      hash:
        desc: "The commit hash"
        type: string

  clone_self:
    desc: "Clones own repo to a temporary directory"
    input:
      hash:
        desc: "The commit hash to checkout"
        type: string
    output:
      dir:
        desc: "The directory where the repo was cloned to"
        type: path

  cd:
    desc: "Change directory"
    input:
      path:
        desc: "The path to change directory to"
        type: path
    output: {}

  bun_install:
    desc: "Run bun install from cwd"
    input:
      frozen_lockfile:
        desc: "--frozen-lockfile"
        type: bool
        default: true
    output: {}

# All assertions that can be used in simtests. Output is fixed:
# { ok: boolean, message?: string }, so it is not declared here.

asserts:
  dir_exists:
    desc: "Assert that a directory exists at path"
    input:
      path:
        desc: "Directory path, resolved against cwd"
        type: path

  is_clean:
    desc: "Assert the working tree is clean (git status --porcelain empty)"
    input: {}
