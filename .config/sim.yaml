# All actions that can be simulated in the repo.

environments:
  local:
    desc: "Operate in the current repo working tree"
    requires: []

  local_clone:
    desc: "Fresh clone on the host with bun install run on the host"
    requires: [git, bun]

  pod_clone:
    desc: "Fresh clone with bun install run inside a container against the cloned tree"
    requires: [git, docker]

actions:
  get_main_hash:
    desc: "Print the commit hash of remote main"
    input: {}
    output:
      hash:
        desc: "The commit hash"
        type: string

  cd:
    desc: "Change directory"
    input:
      path:
        desc: "The path to change directory to"
        type: path
    output: {}

  bun_install:
    desc: "Run bun install from cwd"
    input:
      frozen_lockfile:
        desc: "--frozen-lockfile"
        type: bool
        default: true
    output: {}

  docker_run:
    desc: "Run a shell script inside a docker container with a single bind-mount"
    input:
      image:
        desc: "Container image to run, e.g. oven/bun:1.3.12-alpine"
        type: string
      script:
        desc: "Shell script passed to `sh -c` inside the container"
        type: string
      mount_src:
        desc: "Absolute host path to bind-mount into the container"
        type: path
      mount_dst:
        desc: "Container path the host directory is mounted at; also the working directory"
        type: path
    output:
      stdout:
        desc: "Captured stdout from the container (UTF-8)"
        type: string
      stderr:
        desc: "Captured stderr from the container (UTF-8)"
        type: string

# All assertions that can be used in simtests. Output is fixed:
# { ok: boolean, message?: string }, so it is not declared here.

asserts:
  dir_exists:
    desc: "Assert that a directory exists at path"
    input:
      path:
        desc: "Directory path, resolved against cwd"
        type: path

  is_clean:
    desc: "Assert the working tree is clean (git status --porcelain empty)"
    input: {}
