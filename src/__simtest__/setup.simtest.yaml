name: "setup"

desc: "Sets up the 'repo' repo and makes sure everything works"

steps:
  - action: get_main_hash
    output:
      hash: main_hash

  - action: clone_self
    input:
      hash: ${{ steps.main_hash }}
    output:
      dir: clone_dir

  - action: cd
    input:
      path: ${{ steps.clone_dir }}

  # Make sure we are in a state that is clean without node_modules.
  - assert_not: dir_exists
    input:
      path: node_modules

  # This should setup the repo, including creating a node_modules.
  - action: bun_install

  # Validate that the node_modules now exist.
  - assert: dir_exists
    input:
      path: node_modules

  - assert: is_clean
